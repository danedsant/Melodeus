name: windows-msvc

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (grupo f0)
        shell: pwsh
        run: .\scripts\fetch_deps.ps1

      - name: Configurar (CMake, VS2022 x64)
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # Los runners no tienen GPU ni dispositivo de audio: solo se ejecutan
      # tests de core. selftest/latency_probe/ort_probe/stream_probe son de
      # validación local.
      - name: Tests
        shell: pwsh
        run: .\build\tests\Release\melodeus_tests.exe

      - name: Formato (clang-format)
        shell: pwsh
        run: |
          $cf = $null
          foreach ($cand in @(
            "C:\Program Files\LLVM\bin\clang-format.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-format.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-format.exe",
            "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin\clang-format.exe",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-format.exe"
          )) { if (Test-Path $cand) { $cf = $cand; break } }
          if (-not $cf) {
            $cmd = Get-Command clang-format -ErrorAction SilentlyContinue
            if ($cmd) { $cf = $cmd.Source }
          }
          if (-not $cf) { throw "clang-format no encontrado" }
          & $cf --version
          $files = git ls-files -- '*.c' '*.cpp' '*.h' '*.hpp'
          $bad = @()
          foreach ($f in $files) {
            & $cf --dry-run -Werror --style=file "$f" 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { $bad += $f }
          }
          if ($bad.Count -gt 0) {
            Write-Host "Archivos sin formatear (ejecute clang-format -i):"
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "Formato OK ($($files.Count) archivos)"

      - name: dxc (sanity para shaders F1+)
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\dxc.exe" -ErrorAction SilentlyContinue |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if ($dxc) {
            Write-Host "dxc: $($dxc.FullName)"
            & $dxc --version
          } else {
            Write-Host "dxc no encontrado en el SDK (no bloqueante en F0)"
          }
